name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Circuit proofs, audit sealing, spend caps, the ScreenedPool contract on a local Hardhat
      # chain, and the adverse-media classifier. No keys, no network beyond npm.
      - run: npm test
