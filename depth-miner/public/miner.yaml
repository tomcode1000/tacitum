version: "1"
kind: miner
id: 7314403
slug: tacitum-pool-depth
protocol: generic
name: Tacitum Solana Pool Depth
description: >-
  How much money is really in this Solana pool? An agent needs that answer before it trades, lends,
  lists a token or moves a treasury through a pool, and most liquidity providers can only read Orca,
  Raydium and Meteora. On Telegraph, BisonFi and Byreal pools were asked about 230 times with no answer.
  This miner reads any pool's reserves straight from chain: Raydium (AMM v4, CPMM, CLMM), Orca, Meteora,
  PumpSwap, BisonFi, Byreal and every DEX whose pool holds its own funds. Every answer shows its work
  (the vault accounts, amounts, prices and slot) so anyone can re-check it, confirms through Jupiter
  that trades route through that exact pool, and gives the price impact of a $1k, $10k and $100k trade.
  Measured against GeckoTerminal: 12 of 12 within 2% on every Solana pool asked on Telegraph, and 50 of
  50 top pools answered. Where a DEX keeps funds outside the pool (Scorch, Manifest, Deriverse,
  JupLend, Sanctum) it declines and says why, rather than return a confident wrong number. Built for
  Mission 01 market-integrity alerts and Mission 02 treasury decisions. Solana only; no API key.
base_url: https://depth.54-255-109-186.sslip.io
docs:
  repository: https://github.com/tomcode1000/tacitum
rate_limit_per_sec: 2
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 60
errors:
  message_path: error
endpoints:
  - path: /depth
    external_path: /api/depth
    method: GET
    description: >-
      Liquidity of one Solana DEX pool. Send the pool's account address (base58) as pool and "solana"
      as chain. Returns liquidity_usd (sum of the pool's two reserve vaults in USD), the reserves with
      vault addresses, dex, pair, route_verified, confidence and a price-impact table.
    intents: [LIQUIDITY_DEPTH_VERIFY_GENERAL]
    params:
      query:
        required:
          - name: pool
            type: string
            intents: ["*"]
            description: "Solana pool account address (base58), e.g. 8FnX3xo2yYw3EUE6w3nQA4GfXGS9wpK6oj3veJpbFzLo."
          - name: chain
            type: string
            intents: ["*"]
            description: "Chain of the pool. Only solana is supported."
semantics:
  supported_intents:
    - LIQUIDITY_DEPTH_VERIFY_GENERAL
